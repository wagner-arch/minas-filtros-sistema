# Monta o arquivo de instalacao do aplicativo Android (APK) na nuvem do GitHub,
# de graca. Este computador nao tem Java nem o kit do Android instalados, e o
# GitHub ja faz isso sozinho. Depois de rodar, o arquivo fica em
# Actions > a execucao > Artifacts > minas-filtros-apk.
name: Aplicativo Android

on:
  workflow_dispatch:          # roda quando o Wagner clicar
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Preparar o Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o kit do Android
        uses: android-actions/setup-android@v3

      - name: Montar o aplicativo
        working-directory: android
        run: |
          gradle wrapper --gradle-version 8.7
          ./gradlew assembleRelease --no-daemon

      - name: Guardar o arquivo de instalacao
        uses: actions/upload-artifact@v4
        with:
          name: minas-filtros-apk
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 90
