plugins{
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
}
android{
  namespace "br.com.minasfiltros.sistema"
  compileSdk 34
  defaultConfig{
    applicationId "br.com.minasfiltros.sistema"
    minSdk 26                /* Android 8 em diante: cobre Samsung e Redmi da loja */
    targetSdk 34
    versionCode 1
    versionName "1.0"
  }
  buildTypes{
    release{
      minifyEnabled false
      signingConfig signingConfigs.debug   /* instalacao interna, fora da loja de aplicativos */
    }
  }
  compileOptions{
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions{ jvmTarget = "17" }
}
dependencies{
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "com.google.android.gms:play-services-location:21.3.0"
}
