plugins{
  id "com.android.application"
  id "org.jetbrains.kotlin.android"
}

/* A CHAVE DE ASSINATURA NAO FICA NO PROJETO (o repositorio e publico).
   Ela vem do cofre do GitHub (Settings > Secrets and variables > Actions) por
   variaveis de ambiente, que a compilacao le abaixo:
     MF_CHAVE_ARQ   caminho do arquivo da chave na maquina que compila
     MF_CHAVE_SENHA senha do arquivo
     MF_CHAVE_ALIAS apelido da chave DENTRO do arquivo — NAO se escolhe por fora:
                    quem gerou a chave no Windows nao controla esse nome, e e por
                    isso que o fluxo o DESCOBRE com keytool antes de compilar
                    (ver .github/workflows/android.yml). Nao ha padrao aqui de
                    proposito: apelido errado nao assina, e falhar e melhor que
                    assinar com a chave de teste sem ninguem perceber.
   Sem essas variaveis a compilacao usa a chave de teste do proprio Android,
   que serve para experimentar no computador mas MUDA a cada maquina. */
def chaveArq   = System.getenv("MF_CHAVE_ARQ")
def chaveSenha = System.getenv("MF_CHAVE_SENHA")
def chaveAlias = System.getenv("MF_CHAVE_ALIAS")
def temChave   = chaveArq && chaveSenha && chaveAlias && file(chaveArq).exists()

android{
  namespace "br.com.minasfiltros.sistema"
  compileSdk 34
  defaultConfig{
    applicationId "br.com.minasfiltros.sistema"
    minSdk 26                /* Android 8 em diante: cobre Samsung e Redmi da loja */
    targetSdk 34
    versionCode 6            /* SOBE 1 a cada versao nova do aplicativo */
    versionName "1.5"
  }
  signingConfigs{
    if(temChave){
      nossa{
        storeFile     file(chaveArq)
        storePassword chaveSenha
        keyAlias      chaveAlias
        keyPassword   chaveSenha
        storeType     "PKCS12"
      }
    }
  }
  buildTypes{
    release{
      minifyEnabled false
      /* assinatura fixa: so assim o Android deixa instalar a versao nova POR CIMA */
      signingConfig temChave ? signingConfigs.nossa : signingConfigs.debug
    }
  }
  compileOptions{
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions{ jvmTarget = "17" }
}

/* No servidor do GitHub a chave e obrigatoria PARA ASSINAR: sem ela o arquivo
   sairia com assinatura diferente a cada vez e ninguem conseguiria atualizar
   por cima. A trava vale so para o release — a compilacao de conferencia
   (assembleDebug) roda sem chave, e e ela que prova que o codigo esta certo
   mesmo antes de a chave existir no cofre. */
gradle.taskGraph.whenReady{ grafo ->
  def temRelease = grafo.allTasks.any{ it.name.toLowerCase().contains("release") }
  if(System.getenv("CI") && temRelease && !temChave){
    throw new GradleException("A chave de assinatura nao chegou. Confira os segredos "+
      "MF_CHAVE_BASE64 e MF_CHAVE_SENHA em Settings > Secrets and variables > Actions. "+
      "O apelido da chave o proprio fluxo descobre — ver android/CHAVE-DO-APLICATIVO.md.")
  }
}

dependencies{
  implementation "androidx.appcompat:appcompat:1.7.0"
  implementation "androidx.core:core-ktx:1.13.1"
  implementation "com.google.android.gms:play-services-location:21.3.0"
}
