<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minas Filtros</title>
<script>
/* A versão vem de versao.txt, lido sem cache. Antes o número ficava aqui dentro e o
   navegador guardava este arquivo por 10 minutos: quem abria logo depois de uma publicação
   baixava o sistema INTEIRO na versão velha e, quando ele percebia a versão nova, baixava
   tudo de novo. Agora o celular já entra direto na versão certa.
   Sem internet ou com o arquivo fora do ar, segue com o número gravado aqui. */
(function(){
  var padrao = "228";
  var foi = false;
  function ir(v){ if(foi) return; foi = true; location.replace("sistema-minas.html?v=" + v + location.hash); }
  var t = setTimeout(function(){ ir(padrao); }, 2500);
  try{
    fetch("versao.txt?nc=" + Date.now(), {cache:"no-store"})
      .then(function(r){ return r.text(); })
      .then(function(x){ clearTimeout(t); var n = String(x||"").match(/\d+/); ir(n ? n[0] : padrao); })
      .catch(function(){ clearTimeout(t); ir(padrao); });
  }catch(e){ clearTimeout(t); ir(padrao); }
})();
</script>
<noscript><a href="sistema-minas.html">Abrir o sistema</a></noscript>
